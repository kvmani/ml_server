services:
  redis:
    image: redis:7
  ml_model:
    build: .
    command: python scripts/fake_ml_model_server.py
    env_file:
      - ${ML_SERVER_ENV_FILE:-.env}
    depends_on:
      - redis
  ebsd_model:
    build: .
    command: python scripts/fake_ebsd_model.py
    env_file:
      - ${ML_SERVER_ENV_FILE:-.env}
    depends_on:
      - redis
  celery:
    build:
      context: .
      target: prod
    command: ["celery", "-A", "ml_server.celery_app", "worker", "--loglevel=info"]
    env_file:
      - ${ML_SERVER_ENV_FILE:-.env}
    depends_on:
      - redis

  beat:
    build:
      context: .
      target: prod
    command: ["celery", "-A", "ml_server.celery_app", "beat", "--loglevel=info"]
    env_file:
      - ${ML_SERVER_ENV_FILE:-.env}
    depends_on:
      - redis
  web:
    build:
      context: .
      target: prod
    command: ["gunicorn", "-w", "2", "-b", "0.0.0.0:5000", "ml_server.app.server:create_app()"]
    ports:
      - "127.0.0.1:5000:5000"
    env_file:
      - ${ML_SERVER_ENV_FILE:-.env}
    depends_on:
      - redis
      - ml_model
      - ebsd_model
      - celery
      - beat
