<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="t d"><title id="t">Online Annotator ground-truth workflow</title><desc id="d">Micrographs and class definitions are imported, labelled pixel by pixel, reviewed by a second person, frozen as fingerprinted versions, and exported as training datasets with a provenance manifest.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#4b75b9"/></marker></defs><rect width="960" height="520" rx="28" fill="#f4f7fb"/><rect x="34" y="32" width="892" height="88" rx="18" fill="#172d50"/><text x="64" y="70" fill="#9ec5ff" font-family="Arial" font-size="15" font-weight="700">ANNOTATE → REVIEW → APPROVE → EXPORT</text><text x="64" y="98" fill="white" font-family="Arial" font-size="24" font-weight="700">Pixel-exact ground truth with traceable provenance</text><g font-family="Arial"><g transform="translate(44 168)"><rect width="162" height="142" rx="16" fill="white" stroke="#b8c9df"/><text x="18" y="31" fill="#d05c45" font-size="13" font-weight="700">01 IMPORT</text><text x="18" y="61" fill="#172d50" font-size="18" font-weight="700">Images + classes</text><text x="18" y="88" fill="#60717c" font-size="13">originals kept intact</text><text x="18" y="109" fill="#60717c" font-size="13">model masks optional</text></g><g transform="translate(230 168)"><rect width="162" height="142" rx="16" fill="#e9f1fb" stroke="#4b75b9"/><text x="18" y="31" fill="#355f9d" font-size="13" font-weight="700">02 ANNOTATE</text><text x="18" y="61" fill="#172d50" font-size="18" font-weight="700">Label map</text><text x="18" y="88" fill="#60717c" font-size="13">brush · wand · Otsu</text><text x="18" y="109" fill="#60717c" font-size="13">one editor per image</text></g><g transform="translate(416 168)"><rect width="162" height="142" rx="16" fill="white" stroke="#b8c9df"/><text x="18" y="31" fill="#d05c45" font-size="13" font-weight="700">03 REVIEW</text><text x="18" y="61" fill="#172d50" font-size="18" font-weight="700">Second person</text><text x="18" y="88" fill="#60717c" font-size="13">approve · correct</text><text x="18" y="109" fill="#60717c" font-size="13">request changes</text></g><g transform="translate(602 168)"><rect width="162" height="142" rx="16" fill="#fff4e8" stroke="#e6b078"/><text x="18" y="31" fill="#b95a3e" font-size="13" font-weight="700">04 VERSION</text><text x="18" y="61" fill="#172d50" font-size="18" font-weight="700">Immutable</text><text x="18" y="88" fill="#60717c" font-size="13">fingerprinted history</text><text x="18" y="109" fill="#60717c" font-size="13">who · when · why</text></g><g transform="translate(788 168)"><rect width="128" height="142" rx="16" fill="#172d50"/><text x="16" y="31" fill="#9ec5ff" font-size="13" font-weight="700">05 EXPORT</text><text x="16" y="61" fill="white" font-size="18" font-weight="700">Dataset</text><text x="16" y="88" fill="#dce7ed" font-size="13">pairs · COCO</text><text x="16" y="109" fill="#dce7ed" font-size="13">manifest.json</text></g></g><g stroke="#4b75b9" stroke-width="3" marker-end="url(#a)"><path d="M207 239H224"/><path d="M393 239H410"/><path d="M579 239H596"/><path d="M765 239H782"/></g><rect x="44" y="350" width="872" height="126" rx="18" fill="white" stroke="#b8c9df"/><text x="70" y="385" fill="#355f9d" font-family="Arial" font-size="14" font-weight="700">CLASS AREA FRACTION</text><text x="70" y="430" fill="#172d50" font-family="Georgia" font-size="28" font-weight="700">f<tspan baseline-shift="sub" font-size="17">c</tspan> = N<tspan baseline-shift="sub" font-size="17">c</tspan> / (W · H)</text><text x="460" y="414" fill="#60717c" font-family="Arial" font-size="14">Every pixel carries exactly one class number,</text><text x="460" y="440" fill="#60717c" font-family="Arial" font-size="14">so masks, statistics and exports are exact.</text></svg>
