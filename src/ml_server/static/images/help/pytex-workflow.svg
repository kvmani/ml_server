<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="t d"><title id="t">PyTex convention-explicit scientific workflow</title><desc id="d">Phase and measurement inputs are normalized into canonical frames and symmetry, analyzed, validated, and exported as explainable scientific results.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#4b75b9"/></marker></defs><rect width="960" height="520" rx="28" fill="#f4f7fb"/><rect x="34" y="32" width="892" height="88" rx="18" fill="#172d50"/><text x="64" y="70" fill="#9ec5ff" font-family="Arial" font-size="15" font-weight="700">CRYSTAL → SPECIMEN → DETECTOR → RECIPROCAL</text><text x="64" y="98" fill="white" font-family="Arial" font-size="24" font-weight="700">Explicit semantics before numerical analysis</text><g font-family="Arial"><g transform="translate(44 168)"><rect width="162" height="142" rx="16" fill="white" stroke="#b8c9df"/><text x="18" y="31" fill="#d05c45" font-size="13" font-weight="700">01 DEFINE</text><text x="18" y="61" fill="#172d50" font-size="18" font-weight="700">Phase + data</text><text x="18" y="88" fill="#60717c" font-size="13">lattice · symmetry</text><text x="18" y="109" fill="#60717c" font-size="13">measurement geometry</text></g><g transform="translate(230 168)"><rect width="162" height="142" rx="16" fill="#e9f1fb" stroke="#4b75b9"/><text x="18" y="31" fill="#355f9d" font-size="13" font-weight="700">02 NORMALIZE</text><text x="18" y="61" fill="#172d50" font-size="18" font-weight="700">Canonical model</text><text x="18" y="88" fill="#60717c" font-size="13">frames · conventions</text><text x="18" y="109" fill="#60717c" font-size="13">provenance retained</text></g><g transform="translate(416 168)"><rect width="162" height="142" rx="16" fill="white" stroke="#b8c9df"/><text x="18" y="31" fill="#d05c45" font-size="13" font-weight="700">03 COMPUTE</text><text x="18" y="61" fill="#172d50" font-size="18" font-weight="700">Domain method</text><text x="18" y="88" fill="#60717c" font-size="13">texture · EBSD · TEM</text><text x="18" y="109" fill="#60717c" font-size="13">diffraction · OR</text></g><g transform="translate(602 168)"><rect width="162" height="142" rx="16" fill="#fff4e8" stroke="#e6b078"/><text x="18" y="31" fill="#b95a3e" font-size="13" font-weight="700">04 VALIDATE</text><text x="18" y="61" fill="#172d50" font-size="18" font-weight="700">Reduce + check</text><text x="18" y="88" fill="#60717c" font-size="13">symmetry · tolerance</text><text x="18" y="109" fill="#60717c" font-size="13">reference evidence</text></g><g transform="translate(788 168)"><rect width="128" height="142" rx="16" fill="#172d50"/><text x="16" y="31" fill="#9ec5ff" font-size="13" font-weight="700">05 EXPLAIN</text><text x="16" y="61" fill="white" font-size="18" font-weight="700">Result</text><text x="16" y="88" fill="#dce7ed" font-size="13">figure · JSON</text><text x="16" y="109" fill="#dce7ed" font-size="13">describe()</text></g></g><g stroke="#4b75b9" stroke-width="3" marker-end="url(#a)"><path d="M207 239H224"/><path d="M393 239H410"/><path d="M579 239H596"/><path d="M765 239H782"/></g><rect x="44" y="350" width="872" height="126" rx="18" fill="white" stroke="#b8c9df"/><text x="70" y="385" fill="#355f9d" font-family="Arial" font-size="14" font-weight="700">CANONICAL MAPPING</text><text x="70" y="430" fill="#172d50" font-family="Georgia" font-size="28" font-weight="700">v<tspan baseline-shift="sub" font-size="17">specimen</tspan> = g v<tspan baseline-shift="sub" font-size="17">crystal</tspan></text><text x="460" y="414" fill="#60717c" font-family="Arial" font-size="14">The mapping direction, frame, symmetry,</text><text x="460" y="440" fill="#60717c" font-family="Arial" font-size="14">basis, units, and provenance travel together.</text></svg>
