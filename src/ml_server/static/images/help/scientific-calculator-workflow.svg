<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="t d"><title id="t">Safe scientific expression evaluation workflow</title><desc id="d">An expression is parsed, its syntax allow-listed, variables and angle units are bound, finite values are evaluated, and scalar or bounded plot data are returned.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#27858d"/></marker></defs><rect width="960" height="520" rx="28" fill="#f2f8f8"/><rect x="34" y="32" width="892" height="88" rx="18" fill="#16464f"/><text x="64" y="70" fill="#a8e2e2" font-family="Arial" font-size="15" font-weight="700">TEXT → VALIDATED NUMERICAL RESULT</text><text x="64" y="98" fill="white" font-family="Arial" font-size="24" font-weight="700">Parse first; evaluate only approved mathematics</text><g font-family="Arial"><g transform="translate(44 168)"><rect width="162" height="142" rx="16" fill="white" stroke="#bdd8d9"/><text x="18" y="31" fill="#d05c45" font-size="13" font-weight="700">01 INPUT</text><text x="18" y="61" fill="#16464f" font-size="18" font-weight="700">Expression</text><text x="18" y="88" fill="#5d7074" font-size="13">operators · functions</text><text x="18" y="109" fill="#5d7074" font-size="13">variables · constants</text></g><g transform="translate(230 168)"><rect width="162" height="142" rx="16" fill="#e2f2f2" stroke="#27858d"/><text x="18" y="31" fill="#1e737a" font-size="13" font-weight="700">02 PARSE</text><text x="18" y="61" fill="#16464f" font-size="18" font-weight="700">Syntax tree</text><text x="18" y="88" fill="#5d7074" font-size="13">reject unsafe nodes</text><text x="18" y="109" fill="#5d7074" font-size="13">canonical expression</text></g><g transform="translate(416 168)"><rect width="162" height="142" rx="16" fill="white" stroke="#bdd8d9"/><text x="18" y="31" fill="#d05c45" font-size="13" font-weight="700">03 BIND</text><text x="18" y="61" fill="#16464f" font-size="18" font-weight="700">Context</text><text x="18" y="88" fill="#5d7074" font-size="13">finite numbers</text><text x="18" y="109" fill="#5d7074" font-size="13">degrees / radians</text></g><g transform="translate(602 168)"><rect width="162" height="142" rx="16" fill="#fff4e8" stroke="#e6b078"/><text x="18" y="31" fill="#b95a3e" font-size="13" font-weight="700">04 EVALUATE</text><text x="18" y="61" fill="#16464f" font-size="18" font-weight="700">Point / grid</text><text x="18" y="88" fill="#5d7074" font-size="13">bounded samples</text><text x="18" y="109" fill="#5d7074" font-size="13">finite result check</text></g><g transform="translate(788 168)"><rect width="128" height="142" rx="16" fill="#16464f"/><text x="16" y="31" fill="#a8e2e2" font-size="13" font-weight="700">05 OUTPUT</text><text x="16" y="61" fill="white" font-size="18" font-weight="700">Value</text><text x="16" y="88" fill="#dcebea" font-size="13">scalar / series</text><text x="16" y="109" fill="#dcebea" font-size="13">plot-ready grid</text></g></g><g stroke="#27858d" stroke-width="3" marker-end="url(#a)"><path d="M207 239H224"/><path d="M393 239H410"/><path d="M579 239H596"/><path d="M765 239H782"/></g><rect x="44" y="350" width="872" height="126" rx="18" fill="white" stroke="#bdd8d9"/><text x="70" y="385" fill="#1e737a" font-family="Arial" font-size="14" font-weight="700">ANGLE CONVENTION</text><text x="70" y="430" fill="#16464f" font-family="Georgia" font-size="27" font-weight="700">sin<tspan baseline-shift="sub" font-size="16">deg</tspan>(α) = sin(πα / 180)</text><text x="500" y="414" fill="#5d7074" font-family="Arial" font-size="14">Choose the angle convention explicitly.</text><text x="500" y="440" fill="#5d7074" font-family="Arial" font-size="14">A bounded grid protects the local service.</text></svg>
