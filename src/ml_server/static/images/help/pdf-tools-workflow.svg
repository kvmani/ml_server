<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="t d"><title id="t">PDF tools page transformation workflow</title><desc id="d">Local PDFs are validated, page trees are read, ordered page ranges are selected, page objects are copied, and a new document is streamed.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b84d45"/></marker></defs><rect width="960" height="520" rx="28" fill="#fbf6f4"/><rect x="34" y="32" width="892" height="88" rx="18" fill="#542b31"/><text x="64" y="70" fill="#ffc2b7" font-family="Arial" font-size="15" font-weight="700">LOCAL DOCUMENT TRANSFORMATION</text><text x="64" y="98" fill="white" font-family="Arial" font-size="24" font-weight="700">Validate · inspect · select · assemble · stream</text><g font-family="Arial"><g transform="translate(44 168)"><rect width="162" height="142" rx="16" fill="white" stroke="#dec7c3"/><text x="18" y="31" fill="#b84d45" font-size="13" font-weight="700">01 INPUT</text><text x="18" y="61" fill="#542b31" font-size="18" font-weight="700">PDF files</text><text x="18" y="88" fill="#6f6263" font-size="13">type · size · state</text><text x="18" y="109" fill="#6f6263" font-size="13">local request data</text></g><g transform="translate(230 168)"><rect width="162" height="142" rx="16" fill="#f8e9e6" stroke="#b84d45"/><text x="18" y="31" fill="#9d3933" font-size="13" font-weight="700">02 PARSE</text><text x="18" y="61" fill="#542b31" font-size="18" font-weight="700">Page tree</text><text x="18" y="88" fill="#6f6263" font-size="13">count · metadata</text><text x="18" y="109" fill="#6f6263" font-size="13">preview evidence</text></g><g transform="translate(416 168)"><rect width="162" height="142" rx="16" fill="white" stroke="#dec7c3"/><text x="18" y="31" fill="#b84d45" font-size="13" font-weight="700">03 SELECT</text><text x="18" y="61" fill="#542b31" font-size="18" font-weight="700">Ordered ranges</text><text x="18" y="88" fill="#6f6263" font-size="13">1-based pages</text><text x="18" y="109" fill="#6f6263" font-size="13">inclusive bounds</text></g><g transform="translate(602 168)"><rect width="162" height="142" rx="16" fill="#fff4e8" stroke="#e6b078"/><text x="18" y="31" fill="#b95a3e" font-size="13" font-weight="700">04 ASSEMBLE</text><text x="18" y="61" fill="#542b31" font-size="18" font-weight="700">Copy pages</text><text x="18" y="88" fill="#6f6263" font-size="13">preserve page objects</text><text x="18" y="109" fill="#6f6263" font-size="13">write new tree</text></g><g transform="translate(788 168)"><rect width="128" height="142" rx="16" fill="#542b31"/><text x="16" y="31" fill="#ffc2b7" font-size="13" font-weight="700">05 OUTPUT</text><text x="16" y="61" fill="white" font-size="18" font-weight="700">Download</text><text x="16" y="88" fill="#f0dcda" font-size="13">PDF / images</text><text x="16" y="109" fill="#f0dcda" font-size="13">request discarded</text></g></g><g stroke="#b84d45" stroke-width="3" marker-end="url(#a)"><path d="M207 239H224"/><path d="M393 239H410"/><path d="M579 239H596"/><path d="M765 239H782"/></g><rect x="44" y="350" width="872" height="126" rx="18" fill="white" stroke="#dec7c3"/><text x="70" y="385" fill="#9d3933" font-family="Arial" font-size="14" font-weight="700">ORDER IS THE ALGORITHM</text><text x="70" y="430" fill="#542b31" font-family="Georgia" font-size="27" font-weight="700">P<tspan baseline-shift="sub" font-size="16">out</tspan> = concat(P<tspan baseline-shift="sub" font-size="16">j</tspan>[a<tspan baseline-shift="sub" font-size="16">j</tspan>:b<tspan baseline-shift="sub" font-size="16">j</tspan>])</text><text x="510" y="414" fill="#6f6263" font-family="Arial" font-size="14">Preview the order before download.</text><text x="510" y="440" fill="#6f6263" font-family="Arial" font-size="14">Page operations do not edit page content.</text></svg>
