<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="t d"><title id="t">Hydride segmentation scientific workflow</title><desc id="d">A calibrated micrograph passes through model inference or conventional segmentation, morphology and connected component measurement, human review, then traceable masks and reports.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#3fa78b"/></marker><linearGradient id="g" x2="1" y2="1"><stop stop-color="#0d554d"/><stop offset="1" stop-color="#173b56"/></linearGradient></defs><rect width="960" height="520" rx="28" fill="#f3f8f7"/><rect x="34" y="32" width="892" height="88" rx="18" fill="url(#g)"/><text x="64" y="70" fill="#9de0ca" font-family="Arial" font-size="15" font-weight="700">MICROSTRUCTURE → QUANTITATIVE EVIDENCE</text><text x="64" y="98" fill="white" font-family="Arial" font-size="24" font-weight="700">Calibrate · segment · review · quantify · report</text><g font-family="Arial" fill="#173b56"><g transform="translate(44 168)"><rect width="162" height="142" rx="16" fill="white" stroke="#bfd4cf"/><text x="18" y="31" font-size="13" font-weight="700" fill="#e86f51">01 INPUT</text><text x="18" y="61" font-size="18" font-weight="700">Micrograph</text><text x="18" y="88" font-size="13">pixel size · ROI</text><text x="18" y="109" font-size="13">reference direction</text></g><g transform="translate(230 168)"><rect width="162" height="142" rx="16" fill="#e7f4f0" stroke="#3fa78b"/><text x="18" y="31" font-size="13" font-weight="700" fill="#0d554d">02 SEGMENT</text><text x="18" y="61" font-size="18" font-weight="700">ML / classical</text><text x="18" y="88" font-size="13">confidence threshold</text><text x="18" y="109" font-size="13">binary feature mask</text></g><g transform="translate(416 168)"><rect width="162" height="142" rx="16" fill="white" stroke="#bfd4cf"/><text x="18" y="31" font-size="13" font-weight="700" fill="#e86f51">03 MEASURE</text><text x="18" y="61" font-size="18" font-weight="700">Components</text><text x="18" y="88" font-size="13">area · length · angle</text><text x="18" y="109" font-size="13">morphology filters</text></g><g transform="translate(602 168)"><rect width="162" height="142" rx="16" fill="#fff4e8" stroke="#e6b078"/><text x="18" y="31" font-size="13" font-weight="700" fill="#b95a3e">04 VALIDATE</text><text x="18" y="61" font-size="18" font-weight="700">Human review</text><text x="18" y="88" font-size="13">overlay · correct</text><text x="18" y="109" font-size="13">accept / revise</text></g><g transform="translate(788 168)"><rect width="128" height="142" rx="16" fill="#173b56"/><text x="16" y="31" font-size="13" font-weight="700" fill="#9de0ca">05 OUTPUT</text><text x="16" y="61" font-size="18" font-weight="700" fill="white">Evidence</text><text x="16" y="88" font-size="13" fill="#dce7ed">mask · metrics</text><text x="16" y="109" font-size="13" fill="#dce7ed">report · provenance</text></g></g><g stroke="#3fa78b" stroke-width="3" marker-end="url(#a)"><path d="M207 239H224"/><path d="M393 239H410"/><path d="M579 239H596"/><path d="M765 239H782"/></g><rect x="44" y="350" width="872" height="126" rx="18" fill="white" stroke="#bfd4cf"/><text x="70" y="385" fill="#0d554d" font-family="Arial" font-size="14" font-weight="700">SCIENTIFIC CHECK</text><text x="70" y="430" fill="#173b56" font-family="Georgia" font-size="28" font-weight="700">f<tspan baseline-shift="sub" font-size="17">A</tspan> = A<tspan baseline-shift="sub" font-size="17">hydride</tspan> / A<tspan baseline-shift="sub" font-size="17">ROI</tspan></text><text x="430" y="414" fill="#60717c" font-family="Arial" font-size="14">Calibration controls physical size.</text><text x="430" y="440" fill="#60717c" font-family="Arial" font-size="14">Visual acceptance controls scientific trust.</text></svg>
