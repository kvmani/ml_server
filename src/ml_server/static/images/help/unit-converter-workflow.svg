<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="t d"><title id="t">Dimension-aware unit conversion workflow</title><desc id="d">A magnitude and units are parsed, aliases resolved, dimensions checked, scale or offset applied, and a canonical converted quantity formatted.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#567c54"/></marker></defs><rect width="960" height="520" rx="28" fill="#f5f8f2"/><rect x="34" y="32" width="892" height="88" rx="18" fill="#284629"/><text x="64" y="70" fill="#bfe5bc" font-family="Arial" font-size="15" font-weight="700">QUANTITY → SAME QUANTITY, NEW UNIT</text><text x="64" y="98" fill="white" font-family="Arial" font-size="24" font-weight="700">Dimensional compatibility is non-negotiable</text><g font-family="Arial"><g transform="translate(44 168)"><rect width="162" height="142" rx="16" fill="white" stroke="#cbd9c6"/><text x="18" y="31" fill="#d05c45" font-size="13" font-weight="700">01 INPUT</text><text x="18" y="61" fill="#284629" font-size="18" font-weight="700">Magnitude + unit</text><text x="18" y="88" fill="#627060" font-size="13">source · target</text><text x="18" y="109" fill="#627060" font-size="13">absolute / interval</text></g><g transform="translate(230 168)"><rect width="162" height="142" rx="16" fill="#e8f2e4" stroke="#567c54"/><text x="18" y="31" fill="#456b43" font-size="13" font-weight="700">02 RESOLVE</text><text x="18" y="61" fill="#284629" font-size="18" font-weight="700">Unit registry</text><text x="18" y="88" fill="#627060" font-size="13">aliases · prefixes</text><text x="18" y="109" fill="#627060" font-size="13">compound units</text></g><g transform="translate(416 168)"><rect width="162" height="142" rx="16" fill="white" stroke="#cbd9c6"/><text x="18" y="31" fill="#d05c45" font-size="13" font-weight="700">03 CHECK</text><text x="18" y="61" fill="#284629" font-size="18" font-weight="700">Dimensions</text><text x="18" y="88" fill="#627060" font-size="13">[source] = [target]</text><text x="18" y="109" fill="#627060" font-size="13">reject mismatch</text></g><g transform="translate(602 168)"><rect width="162" height="142" rx="16" fill="#fff4e8" stroke="#e6b078"/><text x="18" y="31" fill="#b95a3e" font-size="13" font-weight="700">04 TRANSFORM</text><text x="18" y="61" fill="#284629" font-size="18" font-weight="700">Scale / offset</text><text x="18" y="88" fill="#627060" font-size="13">base-unit bridge</text><text x="18" y="109" fill="#627060" font-size="13">affine temperature</text></g><g transform="translate(788 168)"><rect width="128" height="142" rx="16" fill="#284629"/><text x="16" y="31" fill="#bfe5bc" font-size="13" font-weight="700">05 OUTPUT</text><text x="16" y="61" fill="white" font-size="18" font-weight="700">Quantity</text><text x="16" y="88" fill="#e0eadc" font-size="13">magnitude</text><text x="16" y="109" fill="#e0eadc" font-size="13">canonical unit</text></g></g><g stroke="#567c54" stroke-width="3" marker-end="url(#a)"><path d="M207 239H224"/><path d="M393 239H410"/><path d="M579 239H596"/><path d="M765 239H782"/></g><rect x="44" y="350" width="872" height="126" rx="18" fill="white" stroke="#cbd9c6"/><text x="70" y="385" fill="#456b43" font-family="Arial" font-size="14" font-weight="700">DIMENSIONAL INVARIANT</text><text x="70" y="430" fill="#284629" font-family="Georgia" font-size="27" font-weight="700">dim(q<tspan baseline-shift="sub" font-size="16">source</tspan>) = dim(q<tspan baseline-shift="sub" font-size="16">target</tspan>)</text><text x="525" y="414" fill="#627060" font-family="Arial" font-size="14">Offsets apply to absolute temperatures.</text><text x="525" y="440" fill="#627060" font-family="Arial" font-size="14">Intervals use scale only.</text></svg>
