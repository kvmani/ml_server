<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="t d"><title id="t">Leakage-aware tabular machine learning workflow</title><desc id="d">A table is profiled and split, preprocessing and models are fit only on training folds, candidates are cross-validated, and final performance is checked on held-out data.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#6279c4"/></marker></defs><rect width="960" height="520" rx="28" fill="#f5f6fb"/><rect x="34" y="32" width="892" height="88" rx="18" fill="#26335f"/><text x="64" y="70" fill="#bdc9ff" font-family="Arial" font-size="15" font-weight="700">TABLE → GENERALIZABLE PREDICTION</text><text x="64" y="98" fill="white" font-family="Arial" font-size="24" font-weight="700">Separate evaluation evidence before fitting</text><g font-family="Arial"><g transform="translate(44 168)"><rect width="162" height="142" rx="16" fill="white" stroke="#c7cce1"/><text x="18" y="31" fill="#d05c45" font-size="13" font-weight="700">01 PROFILE</text><text x="18" y="61" fill="#26335f" font-size="18" font-weight="700">Table + target</text><text x="18" y="88" fill="#606878" font-size="13">types · missingness</text><text x="18" y="109" fill="#606878" font-size="13">task · leakage review</text></g><g transform="translate(230 168)"><rect width="162" height="142" rx="16" fill="#eaedfb" stroke="#6279c4"/><text x="18" y="31" fill="#485fa7" font-size="13" font-weight="700">02 SPLIT</text><text x="18" y="61" fill="#26335f" font-size="18" font-weight="700">Train / holdout</text><text x="18" y="88" fill="#606878" font-size="13">group · time · strata</text><text x="18" y="109" fill="#606878" font-size="13">fixed random seed</text></g><g transform="translate(416 168)"><rect width="162" height="142" rx="16" fill="white" stroke="#c7cce1"/><text x="18" y="31" fill="#d05c45" font-size="13" font-weight="700">03 FIT</text><text x="18" y="61" fill="#26335f" font-size="18" font-weight="700">Fold pipeline</text><text x="18" y="88" fill="#606878" font-size="13">impute · encode</text><text x="18" y="109" fill="#606878" font-size="13">scale · train model</text></g><g transform="translate(602 168)"><rect width="162" height="142" rx="16" fill="#fff4e8" stroke="#e6b078"/><text x="18" y="31" fill="#b95a3e" font-size="13" font-weight="700">04 COMPARE</text><text x="18" y="61" fill="#26335f" font-size="18" font-weight="700">Cross-validate</text><text x="18" y="88" fill="#606878" font-size="13">metric distribution</text><text x="18" y="109" fill="#606878" font-size="13">capacity · runtime</text></g><g transform="translate(788 168)"><rect width="128" height="142" rx="16" fill="#26335f"/><text x="16" y="31" fill="#bdc9ff" font-size="13" font-weight="700">05 TEST</text><text x="16" y="61" fill="white" font-size="18" font-weight="700">Holdout</text><text x="16" y="88" fill="#e0e3f0" font-size="13">final metrics</text><text x="16" y="109" fill="#e0e3f0" font-size="13">explain · export</text></g></g><g stroke="#6279c4" stroke-width="3" marker-end="url(#a)"><path d="M207 239H224"/><path d="M393 239H410"/><path d="M579 239H596"/><path d="M765 239H782"/></g><rect x="44" y="350" width="872" height="126" rx="18" fill="white" stroke="#c7cce1"/><text x="70" y="385" fill="#485fa7" font-family="Arial" font-size="14" font-weight="700">LEAKAGE BARRIER</text><text x="70" y="430" fill="#26335f" font-family="Georgia" font-size="27" font-weight="700">z<tspan baseline-shift="sub" font-size="16">j</tspan> = (x<tspan baseline-shift="sub" font-size="16">j</tspan> − μ<tspan baseline-shift="sub" font-size="16">train,j</tspan>) / σ<tspan baseline-shift="sub" font-size="16">train,j</tspan></text><text x="515" y="414" fill="#606878" font-family="Arial" font-size="14">Preprocessing learns from training folds only.</text><text x="515" y="440" fill="#606878" font-family="Arial" font-size="14">The holdout is touched once, at the end.</text></svg>
