# Vendored third-party assets and scientific test fixtures are byte-exact inputs:
# reformatting them (whitespace, final newline) would corrupt them, so no hook may touch them.
exclude: |
  (?x)^(
    src/ml_server/static/vendor/.*|
    tests/test_data/.*
  )$

repos:
  - repo: https://github.com/psf/black
    rev: 23.7.0
    hooks:
      - id: black
        args: [--line-length=100]
  - repo: https://github.com/PyCQA/isort
    rev: 5.12.0
    hooks:
      - id: isort
  - repo: https://github.com/PyCQA/flake8
    rev: 6.1.0
    hooks:
      - id: flake8
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-added-large-files
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
  - repo: local
    hooks:
      - id: forbid-binary
        name: "No binary files"
        entry: bash -c 'git diff --cached --name-only --diff-filter=A | xargs -r file | grep -v "text" && echo "Binary files detected" && exit 1 || true'
        language: system
        types: [file]
