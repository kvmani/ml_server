[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ml_server"
dynamic = ["version"]
description = "Flask and Celery based microstructural analysis server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "Flask==3.0.2",
    "Werkzeug==3.0.1",
    "Jinja2==3.1.2",
    "python-dotenv==1.0.0",
    "Pillow==11.1.0",
    "requests==2.32.4",
    "celery==5.3.6",
    "redis==5.0.1",
    "gunicorn==21.2.0",
    "Flask-Compress==1.14",
    "Flask-Talisman==1.1.0",
    "prometheus-client==0.20.0",
    "Flask-Admin==1.6.1",
    "pypdf>=6,<7",
    "pdf2image",
    "waitress>=3,<4",
    "pdf-tools-service @ https://github.com/kvmani/pdf_tools/archive/refs/tags/v0.2.0.zip",
    "tabular-ml-service @ https://github.com/kvmani/tabular_ml/archive/refs/tags/v0.2.0.zip"
]

[project.optional-dependencies]
test = [
    "pytest==7.4.0",
    "pytest-cov==4.1.0",
    "numpy>=1.26.0",
    "flake8",
    "black",
    "isort",
    "mypy"
]

[project.scripts]
ml-server = "ml_server.cli:main"

[tool.setuptools.dynamic]
version = {attr = "ml_server._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ml_server = ["default_config.json", "templates/*.html", "static/**/*"]

